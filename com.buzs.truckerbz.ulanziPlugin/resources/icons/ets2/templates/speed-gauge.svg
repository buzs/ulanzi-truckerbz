<svg xmlns="http://www.w3.org/2000/svg" width="196" height="196" viewBox="0 0 196 196">
  <!-- Editable template. Dynamic placeholders: TICKS, HALF_MAX, MAX, NEEDLE_X, NEEDLE_Y, VALUE, UNIT. -->
  <rect x="1" y="1" width="194" height="194" rx="22" fill="#050505" stroke="#303030" stroke-width="4"/>
  <circle cx="98" cy="98" r="72" fill="#101010" stroke="#cfd3d8" stroke-width="5"/>
  {{TICKS}}
  <text x="98" y="59" fill="#f4f4f4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" text-anchor="middle">{{HALF_MAX}}</text>
  <text x="50" y="99" fill="#f4f4f4" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" text-anchor="middle">0</text>
  <text x="146" y="99" fill="#f4f4f4" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" text-anchor="middle">{{MAX}}</text>
  <line x1="98" y1="98" x2="{{NEEDLE_X}}" y2="{{NEEDLE_Y}}" stroke="#ff3b30" stroke-width="6" stroke-linecap="round"/>
  <circle cx="98" cy="98" r="8" fill="#eeeeee"/>
  <text x="98" y="136" fill="#eeeeee" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="900" text-anchor="middle">{{VALUE}}</text>
  <text x="98" y="156" fill="#eeeeee" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" text-anchor="middle">{{UNIT}}</text>
</svg>
